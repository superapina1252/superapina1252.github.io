/* --- SYNTHWAVE-TILA --- */
body.synthwave {
  margin: 0;

  overflow-y: auto;        /* salli pystysuuntainen skrollaus */

}

/* Taustapseudo — saa olla fixed ja pointer-events:none */

  content: "";
  position: fixed;
  inset: 0;                 /* top:0; right:0; bottom:0; left:0; */
  z-index: -1;              /* jää body:n (z-index:0) taakse */
  pointer-events: none;     /* ei nappaa klikkejä / skrollia */
  filter: brightness(1.125);
  animation: outrun 0.6s linear infinite;

}

<body>

<div class="card">
  <h1>Seuraava RäbäCup™-kisa</h1>
  <div class="next-race" id="nextRace">Ladataan...</div>
  <div class="countdown" id="countdown">Ladataan...</div>
</div>

<div class="card">
  <h1>Kaikki kisat</h1>
  <ul id="raceList" class="race-list"></ul>
</div>

<button id="toggleRetro">Retro-tila</button>

<script>
async function fetchRaces() {
  const response = await fetch("kisat.txt?ts=" + Date.now(), {
    cache: "no-store"
  });
  const text = await response.text();
  return text
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);
}

function parseFinnishDate(str) {
  const [datePart, timePart] = str.split(" ");
  const [day, month, year] = datePart.split(".");
  return new Date(`${year}-${month}-${day}T${timePart}`);
}

function getWeekdayName(date) {
  return date.toLocaleDateString("fi-FI", { weekday: "long" });
}

function updateCountdown(targetDate) {
  const now = new Date(); /* aika suoraan käyttäjän koneelta */
  let diff = targetDate - now;
  if (diff < 0) diff = 0;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  let parts = [];
  if (days > 0) parts.push(`${days} päivää`);
  if (hours > 0) parts.push(`${hours} tuntia`);
  parts.push(`${minutes} minuuttia`);

  document.getElementById("countdown").textContent =
    parts.join(" ") + " seuraavaan kisaan";
}




/* ------------------ TEEMA ------------------*/
const toggleBtn = document.getElementById("toggleRetro");
const themes = ["modern", "retro", "synthwave"];  /* Kolme teemaa */

/* Alkuperäinen tallennettu teema */
let currentTheme = localStorage.getItem("theme") || "modern";

function applyTheme() {
  /* Poistetaan kaikki teemat */
  document.body.classList.remove(...themes);
  document.body.classList.add(currentTheme);

  /* Päivitetään nappi teksti */
  if (currentTheme === "modern") toggleBtn.textContent = "Retro";
  else if (currentTheme === "retro") toggleBtn.textContent = "Synthwave";
  else toggleBtn.textContent = "Moderni";

  localStorage.setItem("theme", currentTheme);

  /* Päivitetään sivun otsikko */
  document.title = currentTheme === "retro" ? ">>> Kisakalenteri <<<" : "Kisakalenteri";
}

/* Teeman vaihtaminen napista */
toggleBtn.addEventListener("click", () => {
  let index = themes.indexOf(currentTheme);
  index = (index + 1) % themes.length;
  currentTheme = themes[index];
  applyTheme();
});

/* Alustetaan teema sivun latauksessa */
applyTheme();


/* ------------------ COUNTDOWN ------------------ */
const countdownEl = document.getElementById("countdown");

function setBlinkClass(setting) {
  countdownEl.classList.remove("blink-fast", "blink-slow", "no-blink");
  if (setting === "fast") countdownEl.classList.add("blink-fast");
  if (setting === "slow") countdownEl.classList.add("blink-slow");
  if (setting === "none") countdownEl.classList.add("no-blink");
}

function applyBlink() {
  let blinkSetting = localStorage.getItem("countdownBlink") || "fast";
  setBlinkClass(blinkSetting);

  countdownEl.addEventListener("click", () => {
    if (blinkSetting === "fast") blinkSetting = "slow";
    else if (blinkSetting === "slow") blinkSetting = "none";
    else blinkSetting = "fast";

    setBlinkClass(blinkSetting);
    localStorage.setItem("countdownBlink", blinkSetting);
  });
}

applyBlink();

/* ------------------ KISAT ------------------ */
function parseFinnishDate(str) {
  const [datePart, timePart] = str.split(" ");
  const [day, month, year] = datePart.split(".");
  return new Date(`${year}-${month}-${day}T${timePart}`);
}

function getWeekdayName(date) {
  return date.toLocaleDateString("fi-FI", { weekday: "long" });
}

function getFinlandNowLocal() {
  return new Date();
}

function updateCountdown(targetDate) {
  const now = getFinlandNowLocal();
  let diff = targetDate - now;
  if (diff < 0) diff = 0;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  let parts = [];
  if (days > 0) parts.push(`${days} päivää`);
  if (hours > 0) parts.push(`${hours} tuntia`);
  parts.push(`${minutes} minuuttia`);

  countdownEl.textContent = parts.join(" ") + " seuraavaan kisaan";
}

async function fetchRaces() {
  const response = await fetch("kisat.txt?ts=" + Date.now(), { cache: "no-store" });
  const text = await response.text();
  return text.split("\n").map(line => line.trim()).filter(line => line.length > 0);
}

async function init() {
  const raceLines = await fetchRaces();
  const now = getFinlandNowLocal();
  let nextRace = null;

  /* Parsitaan ja järjestetään kisat aina päivämäärän mukaan */
  const races = raceLines.map(line => ({ text: line, date: parseFinnishDate(line) }));
  races.sort((a, b) => a.date - b.date);

  const raceListEl = document.getElementById("raceList");
  raceListEl.innerHTML = "";

  /* Erotellaan tulevat ja menneet kisat */
  const upcoming = races.filter(r => r.date >= now);
  const past = races.filter(r => r.date < now);

  /* Luo listaelementit kaikille */
  function createListItem(race, klass) {
    const li = document.createElement("li");
    const weekdayStr = getWeekdayName(race.date);
    const dateStr = race.date.toLocaleDateString("fi-FI", { day: "numeric", month: "numeric", year: "numeric" });
    const timeStr = race.date.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
    li.innerHTML = `<span class="weekday">${weekdayStr}</span>
                    <span class="date">${dateStr}</span>
                    <span class="time">${timeStr}</span>`;
    li.className = klass;
    return li;
  }

  /* Lisää tulevat kisat */
  if (upcoming.length > 0) {
    const ulUpcoming = document.createElement("ul");
    ulUpcoming.className = "race-list";
    upcoming.forEach(race => {
      ulUpcoming.appendChild(createListItem(race, "upcoming"));
      if (!nextRace || race.date < nextRace) nextRace = race.date;
    });
    raceListEl.appendChild(ulUpcoming);
  }

  /* Lisää menneet kisat */
  if (past.length > 0) {
    const sep = document.createElement("div");
    sep.textContent = "Menneet kisat";
    sep.className = "past-separator";
    raceListEl.appendChild(sep);

    const ulPast = document.createElement("ul");
    ulPast.className = "race-list";
    past.forEach(race => {
      ulPast.appendChild(createListItem(race, "past"));
    });
    raceListEl.appendChild(ulPast);
  }

  /* Päivitä seuraava kisa ja countdown */
  if (nextRace) {
    const optionsDate = { weekday: "long", day: "numeric", month: "numeric", year: "numeric" };
    const dateStr = nextRace.toLocaleDateString("fi-FI", optionsDate);
    const timeStr = nextRace.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
    document.getElementById("nextRace").innerHTML = `<span class="date">${dateStr}</span><span class="time">klo ${timeStr}</span>`;
    setInterval(() => updateCountdown(nextRace), 1000);
    updateCountdown(nextRace);
  } else {
    document.getElementById("nextRace").textContent = "Ei tulevia kisoja";
    countdownEl.textContent = "";
  }
}
init();
</script>
