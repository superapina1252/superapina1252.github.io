<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kisakalenteri</title>
<style>
  /* Normaali tyyli */
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    padding: 10px;
    text-align: center;
  }
  .card {
    background: #222;
    border: 2px solid #555;
    border-radius: 10px;
    padding: 15px 25px;
    margin-bottom: 20px;
    max-width: 700px;
    width: 90vw;
    margin-left: auto;
    margin-right: auto;
    white-space: normal;
    box-sizing: border-box;
    word-wrap: break-word;
    text-align: center;
  }
  .card h1 {
    margin: 0 0 10px;
  }
  .next-race {
    font-size: clamp(1.4rem, 5vw, 2rem);
    color: #ffcc00;
    margin-bottom: 5px;
    white-space: normal;
    line-height: 1.9em;
    text-align: center;
  }
  .next-race .date,
  .next-race .time {
    display: block;
    font-size: clamp(1.4rem, 5vw, 2rem);
    margin-top: 3px;
  }
  .countdown {
    font-size: 1.5em;
    color: #39ff14;
    margin-bottom: 10px;
  }
  .race-list {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    font-size: 1.1em;
    width: 100%;
  }
  .race-list li {
    padding: 6px 0;
    border-bottom: 1px solid #444;
    text-align: center;
  }
  .past { color: #777; }
  .upcoming { color: #fff; }
  .highlight {
    color: #ffcc00;
    font-weight: bold;
  }
  .past-separator {
    font-size: 0.9em;
    color: #666;
    margin: 15px 0 5px 0;
    font-style: italic;
    border-top: 1px solid #666;
    padding-top: 5px;
  }

  /* --- RETRO-TILA --- */
  body.retro {
    font-family: "Courier New", monospace;
    font-weight: 600;
    background: black;
    color: #fff;
    text-align: left;
    font-size: clamp(16px, 2.5vw, 20px);
    line-height: 1.2em;
  }

  body.retro .card {
    background: transparent;
    border: none;
    border-radius: 0;
    text-align: left;
    max-width: 700px;
    width: 100%;
    box-sizing: border-box;
    margin-left: auto;
    margin-right: auto;
    padding: clamp(1px, 4vw, 2px) clamp(10px, 4vw, 25px);
  }
body.retro .card h1 {
  margin: 0;
  font-size: inherit;
  color: white;
  background: rgb(0, 0, 255);
  padding: 2px 2px;
  display: block;          /* inline-block -> block, jotta tausta ulottuu koko leveydelle */
  width: 100%;             /* koko kortin/leveyden levyinen */
  letter-spacing: 1px;
}

  body.retro .next-race {
    font-size: inherit;
    color: cyan;
    margin-bottom: 3px;
    text-align: left;
  }
  body.retro .next-race .date,
  body.retro .next-race .time {
    font-size: inherit;
    margin-top: 2px;
  }
  body.retro .countdown {
    font-size: inherit;
    color: #39ff14;
    margin-bottom: 1px;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

    body.retro .race-list {
    font-size: inherit;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: clamp(0.5em, 4vw, 2.5em);
    margin: 0;
    max-width: 700px;
    box-sizing: border-box;
    width: 100%;
    padding: 0; /* Remove all padding */
  }
  body.retro .race-list li {
    display: contents; /* let spans be grid items */
    border-bottom: none;
    padding: 0;
    text-align: left;
  }
  body.retro .race-list .weekday {
    text-align: left;

  }
  body.retro .race-list .date {
    text-align: left;
    color: #39ff14;
    padding-left: 1.5em;
  }
  body.retro .race-list .time {
    text-align: right;
    padding-right: 1.5em;
  }
  body.retro .past-separator {
    grid-column: 1 / -1;
    text-align: center;
  }
  body.retro .past { color: yellow; }
  body.retro .past .date { color: inherit; }
  body.retro .upcoming { color: #fff; }
  body.retro .highlight {
    color: #ff0;
    background: red;
    font-weight: bold;
  }
  body.retro .past-separator {
    font-size: 16px;
    font-style: normal;
    color: red;
    margin: 5px 0;
    border-top: 1px dashed red;
    padding-top: 3px;
    text-transform: uppercase;
    text-align: left; /* Add this line */

  }

/* Retro-nappi */
#toggleRetro {
  background: #444;
  color: white;
  border: 2px solid #888;
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
  margin: 5px auto 0 auto; /* Adds space above and centers */
  display: block;           /* Makes the button take its own line */
  z-index: 1;
}
  #toggleRetro:hover {
    background: #666;
  }
</style>
</head>
<body>



<div class="card">
  <h1>Seuraava RäbäCup™-kisa</h1>
  <div class="next-race" id="nextRace">Ladataan...</div>
  <div class="countdown" id="countdown">Ladataan...</div>
</div>

<div class="card">
  <h1>Kaikki kisat</h1>
  <ul id="raceList" class="race-list"></ul>
</div>

<button id="toggleRetro">Retro-tila</button>

<script>
async function fetchRaces() {
  // Lisätään cache-buster query-parametri
  const response = await fetch("kisat.txt?ts=" + Date.now(), {
    cache: "no-store"   // estää välimuistin käytön
  });
  const text = await response.text();
  return text
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0);
}


function parseFinnishDate(str) {
  const [datePart, timePart] = str.split(" ");
  const [day, month, year] = datePart.split(".");
  return new Date(`${year}-${month}-${day}T${timePart}`);
}

function getWeekdayName(date) {
  return date.toLocaleDateString("fi-FI", { weekday: "long" });
}

function updateCountdown(targetDate) {
  const now = new Date();
  let diff = targetDate - now;
  if (diff < 0) diff = 0;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  let parts = [];
  if (days > 0) parts.push(`${days} päivää`);
  if (hours > 0) parts.push(`${hours} tuntia`);
  parts.push(`${minutes} minuuttia`);

  document.getElementById("countdown").textContent =
    parts.join(" ") + " seuraavaan kisaan";
}

async function init() {
  const raceLines = await fetchRaces();
  const now = new Date();
  let nextRace = null;

  const races = raceLines.map(line => ({
    text: line,
    date: parseFinnishDate(line)
  }));

  races.sort((a, b) => a.date - b.date);

  const raceListEl = document.getElementById("raceList");
  raceListEl.innerHTML = "";

  const retro = document.body.classList.contains("retro");

  // Split races
  const upcoming = races.filter(r => r.date >= now);
  const past = races.filter(r => r.date < now);

  if (retro) {
    // --- RETRO: two separate grids ---
    // Upcoming races grid
    const ulUpcoming = document.createElement("ul");
    ulUpcoming.className = "race-list";
    upcoming.forEach(race => {
      const li = document.createElement("li");
      const weekdayStr = getWeekdayName(race.date);
      const dateStr = race.date.toLocaleDateString("fi-FI", {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const timeStr = race.date.toLocaleTimeString("fi-FI", {
        hour: "2-digit", minute: "2-digit"
      }).replace(":", ".");
      li.innerHTML = `
        <span class="weekday">${weekdayStr}</span>
        <span class="date">${dateStr}</span>
        <span class="time">${timeStr}</span>
      `;
      li.className = "upcoming";
      ulUpcoming.appendChild(li);
      if (!nextRace || race.date < nextRace) nextRace = race.date;
    });
    raceListEl.appendChild(ulUpcoming);

    // Separator
    if (past.length > 0) {
      const sep = document.createElement("div");
      sep.textContent = "Menneet kisat";
      sep.className = "past-separator";
      raceListEl.appendChild(sep);

      // Past races grid
      const ulPast = document.createElement("ul");
      ulPast.className = "race-list";
      past.forEach(race => {
        const li = document.createElement("li");
        const weekdayStr = getWeekdayName(race.date);
        const dateStr = race.date.toLocaleDateString("fi-FI", {
          day: "numeric", month: "numeric", year: "numeric"
        });
        const timeStr = race.date.toLocaleTimeString("fi-FI", {
          hour: "2-digit", minute: "2-digit"
        }).replace(":", ".");
        li.innerHTML = `
          <span class="weekday">${weekdayStr}</span>
          <span class="date">${dateStr}</span>
          <span class="time">${timeStr}</span>
        `;
        li.className = "past";
        ulPast.appendChild(li);
      });
      raceListEl.appendChild(ulPast);
    }
  } else {
    // --- MODERNI: one list as before ---
    let pastInserted = false;
    races.forEach(race => {
      if (!pastInserted && race.date < now) {
        const sep = document.createElement("li");
        sep.textContent = "Menneet kisat";
        sep.className = "past-separator";
        raceListEl.appendChild(sep);
        pastInserted = true;
      }
      const li = document.createElement("li");
      const weekdayStr = getWeekdayName(race.date);
      const dateStr = race.date.toLocaleDateString("fi-FI", {
        day: "numeric", month: "numeric", year: "numeric"
      });
      const timeStr = race.date.toLocaleTimeString("fi-FI", {
        hour: "2-digit", minute: "2-digit"
      }).replace(":", ".");
      li.innerHTML = `
        <span class="weekday">${weekdayStr}</span>
        <span class="date">${dateStr}</span>
        <span class="time">${timeStr}</span>
      `;
      li.className = race.date < now ? "past" : "upcoming";
      raceListEl.appendChild(li);
      if (race.date >= now && (!nextRace || race.date < nextRace)) nextRace = race.date;
    });
  }

  // Next race & countdown
  if (nextRace) {
    const optionsDate = { weekday: "long", day: "numeric", month: "numeric", year: "numeric" };
    const dateStr = nextRace.toLocaleDateString("fi-FI", optionsDate);
    const timeStr = nextRace.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
    document.getElementById("nextRace").innerHTML =
      `<span class="date">${dateStr}</span><span class="time">klo ${timeStr}</span>`;
    setInterval(() => updateCountdown(nextRace), 1000);
    updateCountdown(nextRace);
  } else {
    document.getElementById("nextRace").textContent = "Ei tulevia kisoja";
    document.getElementById("countdown").textContent = "";
  }
}

/* --- Retro-napin toiminta + localStorage --- */
const toggleBtn = document.getElementById("toggleRetro");

function applyTheme() {
  const retro = localStorage.getItem("retro") === "true";
  document.body.classList.toggle("retro", retro);
  toggleBtn.textContent = retro ? "Moderni" : "Retro";
  
  // Vaihdetaan välilehden otsikko
  document.title = retro 
    ? ">>> Kisakalenteri <<<"
    : "Kisakalenteri";
}

// Käynnistyksessä lataa tila
applyTheme();

// Klikkaus vaihtaa tilan ja tallentaa sen
toggleBtn.addEventListener("click", () => {
  const retroNow = document.body.classList.toggle("retro");
  localStorage.setItem("retro", retroNow ? "true" : "false");
  toggleBtn.textContent = retroNow ? "Moderni" : "Retro";
  document.title = retroNow 
    ? ">>> Kisakalenteri <<<"
    : "Kisakalenteri";
});


init();
</script>


</body>
</html>
